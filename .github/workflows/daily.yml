name: Daily auto-publish

on:
  schedule:
    # 毎日 UTC 22:00 = JST 07:00
    - cron: "0 22 * * *"
    # 朝/夕 2回稼働
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "ai-news-jp-publish"
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version || true

      - name: Fetch sources (Reddit / HN / RSS)
        run: python3 scripts/fetch_sources.py

      - name: Generate articles via Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # claude CLI picks up ANTHROPIC_API_KEY automatically
          python3 scripts/generate_articles.py || echo "generator returned non-zero (likely no new fresh sources)"

      - name: Build static site
        run: python3 scripts/build_site.py

      - name: Commit new content
        run: |
          git config user.name "ai-news-jp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/ site/ data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "daily: auto-generate $(date -u +%F)"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Ping Google IndexNow
        if: success()
        run: |
          KEY="${{ secrets.INDEXNOW_KEY }}"
          if [ -n "$KEY" ]; then
            curl -s "https://www.bing.com/indexnow?url=https://nayo126.github.io/ai-news-jp/&key=$KEY" || true
          fi
